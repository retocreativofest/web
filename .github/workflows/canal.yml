name: Seguidores del canal de WhatsApp
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/canal.py
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet data/canal.json; then
            git config user.name "rcf-bot"
            git config user.email "rcf-bot@users.noreply.github.com"
            git add data/canal.json
            git commit -m "Actualiza seguidores del canal"
            git push
          fi
